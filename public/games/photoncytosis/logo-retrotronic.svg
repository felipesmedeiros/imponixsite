<svg xmlns="http://www.w3.org/2000/svg" width="740" height="236" viewBox="56 94 740 236" style="image-rendering: pixelated">
  <title>Photoncytosis</title>
  <!-- Preserve the supplied bitmap and isolate the lettering for its shadow. -->
  <defs>
    <image id="artwork" width="1050" height="420" href="data:image/png;base64,"/>
    <clipPath id="emblem">
      <rect x="60" y="98" width="228" height="228"/>
    </clipPath>
    <clipPath id="lettering">
      <rect x="330" y="120" width="470" height="200"/>
    </clipPath>
    <filter id="text-shadow" x="320" y="110" width="490" height="220" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#17141b" flood-opacity="0.9"/>
    </filter>
  </defs>
  <g clip-path="url(#emblem)">
    <use href="#artwork"/>
  </g>
  <g filter="url(#text-shadow)">
    <g clip-path="url(#lettering)">
      <use href="#artwork"/>
    </g>
  </g>
</svg>
